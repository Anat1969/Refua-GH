name: check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Safety gate
        run: node scripts/check-safety.mjs
      - name: Install Playwright
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: End to end
        run: |
          python3 -m http.server 8765 &
          sleep 1
          node tests/e2e.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: tests/shots
